AutoName: CallGuard
Summary: Proof-shaped, offline call screening
Description: |-
    CallGuard turns plain-language rules into predictable cellular call
    decisions, entirely offline. It has no account, no ad network, and no
    cloud backend: rule matching, contact lookup, and screening decisions all
    happen on-device.

    Features:

    * Exact number, starts-with, ends-with, contains, regex, contact, and
      specific-number rules, with country-aware normalization.
    * Explicit block/allow behavior with a configurable fallback for unknown
      or invalid caller IDs.
    * Local storage only (Room + DataStore); no phone numbers, contacts, or
      rules are sent to a remote service.
    * Every decision is inspectable: rules and their explanations are visible,
      not hidden behind a single toggle.

    CallGuard screens cellular calls only (not SMS). Android must be told to
    use CallGuard as the active call-screening app; contact-based rules
    additionally require the Contacts permission and fall back to the
    configured behavior when that permission or data is unavailable. Blocked
    calls remain visible in the system call log.

