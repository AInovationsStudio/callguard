# This workflow runs the container-gate ONLY: formatting, lint, unit tests,
# manifest audit, and a debug assemble, none of which need an emulator or
# `/dev/kvm`. It intentionally does NOT run instrumentation
# (`connectedDebugAndroidTest` / `container-test.sh --instrumentation`) or the
# unsigned release build (`container-release.sh`) — GitHub-hosted `ubuntu-24.04`
# runners do not reliably expose `/dev/kvm`, and an emulator boot attempt
# without it is a flaky hang, not a gate. Instrumentation is a required
# pre-release check the release owner runs locally/in a KVM-capable runner
# (see README's "Reproducible container build" section); it does not run on
# every push/PR here. Add an emulator job only once a runner with reliable
# KVM is explicitly available and confirmed.
name: CallGuard build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run reproducible container gate (formatting, lint, unit tests, manifest audit)
        env:
          CONTAINER_ENGINE: docker
          CI: true
        run: ./scripts/container-test.sh

      - name: Assemble debug APK
        env:
          CONTAINER_ENGINE: docker
          CI: true
        run: ./scripts/container-build.sh

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callguard-debug-and-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
